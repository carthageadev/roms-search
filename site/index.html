<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROM Atlas | Nintendo + SEGA</title>
<link rel="stylesheet" href="./style.css">
<meta name="description" content="Fast search over Nintendo & SEGA ROMs from 92.35.124.13 — 67k files indexed weekly">
</head>
<body>
<header>
  <a class="brand" href="./"><span class="brand-mark">RA</span><span><strong>ROM</strong> Atlas<small>Nintendo + SEGA</small></span></a>
  <div class="search-wrap">
    <input id="q" type="text" placeholder="Search &quot;zelda&quot;, &quot;mario&quot;, &quot;sonic&quot; ... (instant)" autocomplete="off">
    <button id="clearBtn" type="button">Clear</button>
  </div>
</header>

<div class="controls">
  <label>Company <select id="companyFilter"><option value="">All companies</option></select></label>
  <label>Console <select id="consoleFilter"><option value="">All consoles</option></select></label>
  <label>Folder <input id="folderFilter" type="text" placeholder="e.g. /Nintendo/Wii"></label>
  <label>Sort by <select id="sortBy">
    <option value="relevance">Relevance</option>
    <option value="title-asc">Title A→Z</option>
    <option value="title-desc">Title Z→A</option>
    <option value="console-asc">Console A→Z</option>
    <option value="company-asc">Company A→Z</option>
    <option value="size-desc">Size ↓</option>
    <option value="size-asc">Size ↑</option>
    <option value="date-desc">Date ↓</option>
  </select></label>
  <span class="pill" id="countPill">Loading index...</span>
</div>

<div class="status-row"><p id="stats"></p><p id="updated">Preparing index...</p></div>
<main>
  <div id="grid" class="grid"></div>
  <div class="pagination">
    <button id="prevBtn">← Prev</button>
    <span id="pageInfo" class="pill"></span>
    <button id="nextBtn">Next →</button>
  </div>
</main>

<footer>
  <div>Indexed weekly via GitHub Actions · <a href="./data/meta.json">Index metadata</a></div>
  <div class="footer-note">Search by title, company, console, or folder.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
